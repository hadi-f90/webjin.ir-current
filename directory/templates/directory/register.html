{% extends 'directory/base.html' %}

{% block title %}ثبت‌نام - راهنمای وب ایران{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-person-plus"></i> ثبت‌نام</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">ثبت‌نام</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
