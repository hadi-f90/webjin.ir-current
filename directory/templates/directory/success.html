{% extends 'directory/base.html' %}

{% block title %}ثبت موفق - دایرکتوری وب‌سایت{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card">
            <div class="card-body py-5">
                <div class="mb-4">
                    <i class="bi bi-check-circle text-success" style="font-size: 4rem;"></i>
                </div>
                <h2>با تشکر!</h2>
                <p class="lead">وب‌سایت شما با موفقیت ثبت شد.</p>
                <p class="text-muted">
                    تیم ما به زودی وب‌سایت شما را بررسی و منتشر خواهد کرد.
                    پس از تأیید، ایمیلی دریافت خواهید کرد.
                </p>
                <hr>
                <div class="d-grid gap-2">
                    <a href="{% url 'index' %}" class="btn btn-primary">
                        <i class="bi bi-house"></i> بازگشت به خانه
                    </a>
                    <a href="{% url 'submit_website' %}" class="btn btn-outline-secondary">
                        ثبت وب‌سایت دیگر
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
