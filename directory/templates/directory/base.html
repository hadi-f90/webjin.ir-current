{% extends '_base.html' %}

{% block main_class %}container my-4{% endblock %}

{% block extra_css %}
<style>
    body {
        font-family: 'Vazirmatn', Tahoma, sans-serif !important;
        line-height: 1.7;
    }

    .website-card {
        transition: all 0.3s ease;
        border: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .website-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    .search-box {
        max-width: 700px;
        margin: 0 auto 2rem;
    }

    .search-box .form-control {
        border-radius: 50px;
        padding: 15px 25px;
        border: 2px solid #e2e8f0;
        font-size: 1.1rem;
    }

    .search-box .form-control:focus {
        border-color: var(--primary-color, #2563eb);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .search-box .btn {
        border-radius: 50px;
        padding: 12px 30px;
    }

    .tag-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
    }

    .tag-chip {
        display: inline-flex;
        align-items: center;
        background: #e0f2fe;
        color: #0369a1;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.9rem;
    }

    .tag-chip .remove-tag {
        margin-right: 6px;
        cursor: pointer;
        opacity: 0.7;
    }

    .tag-chip .remove-tag:hover {
        opacity: 1;
    }

    .tag-suggestions {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        max-height: 200px;
        overflow-y: auto;
        z-index: 1000;
        display: none;
    }

    .tag-suggestions.show {
        display: block;
    }

    .tag-suggestion-item {
        padding: 10px 15px;
        cursor: pointer;
        border-bottom: 1px solid #f1f5f9;
    }

    .tag-suggestion-item:hover {
        background: #f8fafc;
    }

    .tag-suggestion-item:last-child {
        border-bottom: none;
    }
</style>
{% endblock %}
