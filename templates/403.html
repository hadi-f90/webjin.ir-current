{% extends '_base.html' %}

{% block meta_title %}دسترسی ممنوع{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="error-page">
        <div class="error-icon mb-4">
            <i class="bi bi-shield-exclamation text-danger" style="font-size: 6rem;"></i>
        </div>

        <h1 class="display-1 fw-bold text-danger mb-2">۴۰۳</h1>
        <h2 class="mb-3">دسترسی ممنوع!</h2>

        <p class="lead text-muted mb-4">
            متأسفانه شما اجازه دسترسی به این صفحه را ندارید.
        </p>

        <div class="d-flex flex-wrap justify-content-center gap-2">
            <a href="{% url 'websites:home' %}" class="btn btn-primary btn-lg px-4">
                <i class="bi bi-house-door me-2"></i>
                بازگشت به خانه
            </a>
            {% if user.is_authenticated %}
            <a href="{% url 'accounts:profile' %}" class="btn btn-outline-primary btn-lg px-4">
                <i class="bi bi-person me-2"></i>
                پروفایل
            </a>
            {% else %}
            <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary btn-lg px-4">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                ورود
            </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
