{% load static %}

<html lang="fa">

    {% endblock head %}
</head>

<body>
    <main class="flex-shrink-0">

    <!-- Initialize Theme on Page Load (Prevent Flash) -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
